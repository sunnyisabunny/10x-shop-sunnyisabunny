# NOTE: runs the PRD's checks on GitHub's Linux machines for every push and pull request.
# Why it exists: Windows hides some mistakes, such as a wrong-case import, and Vercel builds on Linux.
# Why three Node versions: the app must install and build for an evaluator whichever one they use.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
