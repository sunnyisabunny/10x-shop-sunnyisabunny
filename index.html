<!doctype html>
<!-- NOTE: the one real HTML page of this single-page app. React fills #root, and React Router swaps
     what is inside it without ever reloading the page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="10X Shop: an online store built as a vending machine. Open all night." />
    <meta name="theme-color" content="#05070c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>10X Shop</title>
    <!-- NOTE: applies the saved theme before anything is drawn. React loads later, so without this a daylight
         visitor would see a flash of the dark theme on every page load. -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("shop_theme") === '"light"' ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
